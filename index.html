<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      No zooming, at Upendra's word (15 Oct 2026): "I want the screen to stop
      moving with every touch and having to zoom out every time". Most inputs
      are 14 to 15px, and iOS zooms the page into any input under 16px when it
      is tapped; maximum-scale=1 is what stops that without enlarging every
      field, which he had already declined as a type bump. Double-tap zoom is
      stopped in styles.css (touch-action on html).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c0b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mealo" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Mealo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
